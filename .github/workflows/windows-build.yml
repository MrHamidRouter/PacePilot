name: Windows EXE build and self-test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Restore bundled hardware sensor libraries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path Bin,Vendor -Force | Out-Null
          nuget install LibreHardwareMonitorLib -Version 0.9.4 -Framework net472 -Source https://api.nuget.org/v3/index.json -OutputDirectory Vendor -ExcludeVersion -NonInteractive -DependencyVersion Lowest
          if ($LASTEXITCODE -ne 0) { throw 'Bundled LibreHardwareMonitor NuGet restore failed' }
          $priority = @('net472','net471','net47','net462','net461','net46','net452','net45','net40','netstandard2.0')
          foreach ($pkg in (Get-ChildItem Vendor -Directory)) {
            $lib = Join-Path $pkg.FullName 'lib'
            if (-not (Test-Path $lib)) { continue }
            $folder = $null
            foreach ($tfm in $priority) {
              $target = Join-Path $lib $tfm
              if (Test-Path $target) { $folder = $target; break }
            }
            if (-not $folder) { continue }
            Get-ChildItem -Path $folder -Filter '*.dll' -File | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination (Join-Path Bin $_.Name) -Force
              Write-Host "Bundled $($_.Name) from $($pkg.Name)"
            }
          }
          foreach ($needed in @('LibreHardwareMonitorLib.dll','HidSharp.dll')) {
            if (-not (Test-Path (Join-Path Bin $needed))) { throw "Missing bundled sensor runtime: $needed" }
          }
          # MPL-2.0 requires the library license to accompany redistribution.
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/spdx/license-list-data/main/text/MPL-2.0.txt -OutFile Bin/LICENSE-MPL-2.0.txt
          if (-not (Test-Path Bin/LICENSE-MPL-2.0.txt)) { throw 'Missing MPL-2.0 license' }
          Write-Host 'Sensor runtime packaged beside PacePilot.exe; no hardware monitor installation is necessary.'
      - name: Build UI test executable (non-elevated)
        shell: cmd
        run: |
          if not exist Bin mkdir Bin
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x64 /codepage:65001 /unsafe /optimize+ /out:Bin\PacePilot-test.exe /win32icon:Assets\PacePilot.ico /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll /reference:System.Runtime.Serialization.dll /reference:System.Management.dll Source\Program.cs Source\StudioForm.cs Source\GameDiscovery.cs Source\GitHubUpdates.cs Source\RtssOsdBridge.cs Source\HwInfoBridge.cs Source\FrameActivityBar.cs Source\PremiumVisuals.cs Source\HardwareFallback.cs Source\AfterburnerBridge.cs Source\BuiltInSensors.cs Source\HardwareInventoryService.cs Source\HardwareSensorService.cs Source\SensorMappingForm.cs Source\ReleaseTrust.cs
      - name: English and Persian UI self-test
        shell: powershell
        run: |
          Remove-Item "$env:TEMP\PacePilot-selftest.log" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath .\Bin\PacePilot-test.exe -ArgumentList '--selftest' -Wait -PassThru
          $log = Get-Content "$env:TEMP\PacePilot-selftest.log" -Raw -ErrorAction Stop
          Write-Host $log
          if ($p.ExitCode -ne 0 -or -not $log.StartsWith('PASS:')) { throw 'UI self-test failed' }
      - name: Build distributable EXE requiring Windows UAC
        shell: cmd
        run: |
          if not exist Bin mkdir Bin
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x64 /codepage:65001 /unsafe /optimize+ /win32manifest:Assets\PacePilot.Administrator.manifest /out:Bin\PacePilot.exe /win32icon:Assets\PacePilot.ico /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll /reference:System.Runtime.Serialization.dll /reference:System.Management.dll Source\Program.cs Source\StudioForm.cs Source\GameDiscovery.cs Source\GitHubUpdates.cs Source\RtssOsdBridge.cs Source\HwInfoBridge.cs Source\FrameActivityBar.cs Source\PremiumVisuals.cs Source\HardwareFallback.cs Source\AfterburnerBridge.cs Source\BuiltInSensors.cs Source\HardwareInventoryService.cs Source\HardwareSensorService.cs Source\SensorMappingForm.cs Source\ReleaseTrust.cs

      - name: Optional Authenticode signing (only with real trusted certificate)
        shell: powershell
        env:
          PACEPILOT_SIGNING_PFX_BASE64: ${{ secrets.PACEPILOT_SIGNING_PFX_BASE64 }}
          PACEPILOT_SIGNING_PASSWORD: ${{ secrets.PACEPILOT_SIGNING_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PACEPILOT_SIGNING_PFX_BASE64)) {
            Write-Host 'No signing credential configured: this release is UNSIGNED, Windows may show Unknown Publisher.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:PACEPILOT_SIGNING_PASSWORD)) {
            throw 'Signing certificate configured without password.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'pacepilot-signing.pfx'
          try {
            [System.IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:PACEPILOT_SIGNING_PFX_BASE64))
            $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $tool = Get-ChildItem -Path $kitRoot -Filter signtool.exe -Recurse -File |
              Where-Object { $_.DirectoryName -match '\\x64$' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $tool) { throw 'signtool.exe not found on Windows build runner' }
            & $tool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:PACEPILOT_SIGNING_PASSWORD Bin\PacePilot.exe
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
            $signature = Get-AuthenticodeSignature Bin\PacePilot.exe
            if ($signature.Status -ne 'Valid') { throw "Authenticode verification failed: $($signature.Status)" }
            Write-Host "Authenticode publisher verified: $($signature.SignerCertificate.Subject)"
          }
          finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
      - name: Pack a single ready-to-use Windows ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist/package -Force | Out-Null
          Copy-Item Bin/PacePilot.exe dist/package/PacePilot.exe
          Get-ChildItem Bin -Filter '*.dll' -File | Copy-Item -Destination dist/package/ -Force
          Copy-Item Docs/THIRD_PARTY_NOTICES.md dist/package/THIRD_PARTY_NOTICES.md
          Copy-Item Bin/LICENSE-MPL-2.0.txt dist/package/LICENSE-MPL-2.0.txt
          Copy-Item Setup-PacePilot.bat dist/package/Setup-PacePilot.bat
          Copy-Item README_FA.md dist/package/README_FA.md
          Copy-Item README_EN.md dist/package/README_EN.md
          Copy-Item Docs/SECURITY_AND_RELEASE.md dist/package/SECURITY_AND_RELEASE.md
          # Per-file hashes can be compared without any executable tool or installer.
          $entries = @(Get-ChildItem -Path dist/package -File | Sort-Object Name | ForEach-Object {
            [ordered]@{
              name = $_.Name
              size_bytes = $_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $sign = Get-AuthenticodeSignature dist/package/PacePilot.exe
          $manifest = [ordered]@{
            product = 'PacePilot Studio'
            version = '2.6.1'
            developer = 'Mr.HamidRouter'
            source_repository = 'https://github.com/MrHamidRouter/PacePilot'
            commit = $env:GITHUB_SHA
            build_utc = (Get-Date).ToUniversalTime().ToString('o')
            publisher_signature = $sign.Status.ToString()
            signed_publisher = $(if ($sign.SignerCertificate) { $sign.SignerCertificate.Subject } else { $null })
            files = $entries
          }
          $manifest | ConvertTo-Json -Depth 7 | Set-Content dist/package/INTEGRITY_MANIFEST.json -Encoding UTF8
          Compress-Archive -Path dist/package/* -DestinationPath dist/PacePilot-Windows-x64.zip -Force
          if (-not (Test-Path dist/PacePilot-Windows-x64.zip)) { throw 'ZIP packaging failed' }
          $zipHash = (Get-FileHash dist/PacePilot-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
             (Join-Path (Resolve-Path dist) 'PacePilot-Windows-x64.zip.sha256'),
             "$zipHash  PacePilot-Windows-x64.zip" + [Environment]::NewLine,
             [System.Text.Encoding]::ASCII)
          if ($zipHash -ne (Get-FileHash dist/PacePilot-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw 'ZIP checksum verification failed'
          }
          Write-Host "Release ZIP SHA-256: $zipHash"
          Write-Host "Signed publisher status: $($sign.Status)"
      - name: Verify release ZIP contents against published per-file hashes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $unpacked = Join-Path $env:RUNNER_TEMP 'PacePilot-Verify'
          Expand-Archive -Path dist/PacePilot-Windows-x64.zip -DestinationPath $unpacked -Force
          $manifest = Get-Content (Join-Path $unpacked 'INTEGRITY_MANIFEST.json') -Raw | ConvertFrom-Json
          if ($manifest.version -ne '2.6.1') { throw 'Mismatched manifest version' }
          if ($manifest.commit -ne $env:GITHUB_SHA) { throw 'Mismatched manifest source commit' }
          foreach ($entry in $manifest.files) {
            $file = Join-Path $unpacked $entry.name
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing packaged file: $($entry.name)" }
            $actual = Get-FileHash -LiteralPath $file -Algorithm SHA256
            if ($actual.Hash.ToLowerInvariant() -ne $entry.sha256) {
              throw "SHA-256 mismatch in packaged file $($entry.name)"
            }
            if ((Get-Item -LiteralPath $file).Length -ne $entry.size_bytes) {
              throw "Size mismatch in packaged file $($entry.name)"
            }
          }
          Write-Host "Verified $(@($manifest.files).Count) packaged files and source commit."
      - name: Publish ready-to-use Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: PacePilot-Windows-x64-ZIP
          path: |
            dist/PacePilot-Windows-x64.zip
            dist/PacePilot-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Attest the ZIP provenance (GitHub OIDC / Sigstore)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: dist/PacePilot-Windows-x64.zip

      - name: Publish ZIP to the GitHub Releases download page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = 'v2.6.1'
          $package = 'dist/PacePilot-Windows-x64.zip'
          $checksum = 'dist/PacePilot-Windows-x64.zip.sha256'
          if (-not (Test-Path $package) -or -not (Test-Path $checksum)) { throw 'Release ZIP or SHA256 checksum missing' }
          # Listing releases succeeds with an empty array on first publication.
          # Avoid `gh release view` here: a 404 can terminate PowerShell.
          $releaseJson = gh release list --repo $repo --json tagName --limit 100
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list GitHub releases' }
          $releases = @($releaseJson | ConvertFrom-Json)
          $exists = @($releases | Where-Object { $_.tagName -eq $tag }).Count -gt 0
          if ($exists) {
            Write-Host "Updating existing release $tag"
            gh release upload $tag $package $checksum --clobber --repo $repo
          } else {
            Write-Host "Creating first release $tag"
            gh release create $tag $package $checksum --repo $repo --target $env:GITHUB_SHA --title 'PacePilot Studio 2.6.1' --notes 'PacePilot Studio 2.6.1 release transparency: public SHA-256 ZIP checksum, in-package SHA-256 manifest per file, GitHub signed build provenance, honest executable signature status and security guide, clean version branding and new verification controls in About. This lightweight native WinForms build is not digitally signed unless a trusted Authenticode certificate is configured in repository secrets. Small ZIP size is due to compression and framework dependencies, not padding. RTSS, hardware telemetry, six themes and game libraries are unchanged.' --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publish failed' }
