name: Windows EXE build and self-test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build UI test executable (non-elevated)
        shell: cmd
        run: |
          if not exist Bin mkdir Bin
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x64 /codepage:65001 /unsafe /optimize+ /out:Bin\PacePilot-test.exe /win32icon:Assets\PacePilot.ico /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll /reference:System.Runtime.Serialization.dll /resource:Docs\Previews\01-Neon-Teal.jpg,PacePilot.UI.teal /resource:Docs\Previews\02-Windows-Blue.jpg,PacePilot.UI.light /resource:Docs\Previews\03-Cyber-Purple.jpg,PacePilot.UI.purple /resource:Docs\Previews\04-Racing-Red.jpg,PacePilot.UI.racing /resource:Docs\Previews\05-Esports-Lime.jpg,PacePilot.UI.lime /resource:Docs\Previews\06-Graphite-Gold.jpg,PacePilot.UI.gold Source\Program.cs Source\StudioForm.cs Source\GameDiscovery.cs Source\GitHubUpdates.cs Source\RtssOsdBridge.cs
      - name: English and Persian UI self-test
        shell: powershell
        run: |
          Remove-Item "$env:TEMP\PacePilot-selftest.log" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath .\Bin\PacePilot-test.exe -ArgumentList '--selftest' -Wait -PassThru
          $log = Get-Content "$env:TEMP\PacePilot-selftest.log" -Raw -ErrorAction Stop
          Write-Host $log
          if ($p.ExitCode -ne 0 -or -not $log.StartsWith('PASS:')) { throw 'UI self-test failed' }
      - name: Build distributable EXE requiring Windows UAC
        shell: cmd
        run: |
          if not exist Bin mkdir Bin
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x64 /codepage:65001 /unsafe /optimize+ /win32manifest:Assets\PacePilot.Administrator.manifest /out:Bin\PacePilot.exe /win32icon:Assets\PacePilot.ico /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll /reference:System.Runtime.Serialization.dll /resource:Docs\Previews\01-Neon-Teal.jpg,PacePilot.UI.teal /resource:Docs\Previews\02-Windows-Blue.jpg,PacePilot.UI.light /resource:Docs\Previews\03-Cyber-Purple.jpg,PacePilot.UI.purple /resource:Docs\Previews\04-Racing-Red.jpg,PacePilot.UI.racing /resource:Docs\Previews\05-Esports-Lime.jpg,PacePilot.UI.lime /resource:Docs\Previews\06-Graphite-Gold.jpg,PacePilot.UI.gold Source\Program.cs Source\StudioForm.cs Source\GameDiscovery.cs Source\GitHubUpdates.cs Source\RtssOsdBridge.cs
      - name: Pack a single ready-to-use Windows ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist/package -Force | Out-Null
          Copy-Item Bin/PacePilot.exe dist/package/PacePilot.exe
          Copy-Item Setup-PacePilot.bat dist/package/Setup-PacePilot.bat
          Copy-Item README_FA.md dist/package/README_FA.md
          Copy-Item README_EN.md dist/package/README_EN.md
          Compress-Archive -Path dist/package/* -DestinationPath dist/PacePilot-Windows-x64.zip -Force
          if (-not (Test-Path dist/PacePilot-Windows-x64.zip)) { throw 'ZIP packaging failed' }
      - name: Publish ready-to-use Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PacePilot-Windows-x64-ZIP
          path: dist/PacePilot-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish ZIP to the GitHub Releases download page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = 'v2.2.0'
          $package = 'dist/PacePilot-Windows-x64.zip'
          if (-not (Test-Path $package)) { throw 'Release ZIP missing' }
          # Listing releases succeeds with an empty array on first publication.
          # Avoid `gh release view` here: a 404 can terminate PowerShell.
          $releaseJson = gh release list --repo $repo --json tagName --limit 100
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list GitHub releases' }
          $releases = @($releaseJson | ConvertFrom-Json)
          $exists = @($releases | Where-Object { $_.tagName -eq $tag }).Count -gt 0
          if ($exists) {
            Write-Host "Updating existing release $tag"
            gh release upload $tag $package --clobber --repo $repo
          } else {
            Write-Host "Creating first release $tag"
            gh release create $tag $package --repo $repo --target $env:GITHUB_SHA --title 'PacePilot Studio 2.2.0' --notes 'PacePilot Studio 2.2.0: RTSS in-game OSD and live frametime bar, Alt+Shift+O toggle, real CPU/RAM sampling, target-specific protected-game compatibility checks. RTSS-hook compatibility varies by game; no anti-cheat bypass.' --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publish failed' }
