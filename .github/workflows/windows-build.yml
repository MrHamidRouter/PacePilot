name: Windows EXE build and self-test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows GUI EXE
        shell: cmd
        run: |
          if not exist Bin mkdir Bin
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x64 /codepage:65001 /optimize+ /out:Bin\PacePilot.exe /win32icon:Assets\PacePilot.ico /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll /reference:System.Runtime.Serialization.dll Source\Program.cs Source\StudioForm.cs
      - name: English and Persian UI self-test
        shell: powershell
        run: |
          Remove-Item "$env:TEMP\PacePilot-selftest.log" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath .\Bin\PacePilot.exe -ArgumentList '--selftest' -Wait -PassThru
          $log = Get-Content "$env:TEMP\PacePilot-selftest.log" -Raw -ErrorAction Stop
          Write-Host $log
          if ($p.ExitCode -ne 0 -or -not $log.StartsWith('PASS:')) { throw 'UI self-test failed' }
      - name: Pack a single ready-to-use Windows ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist/package -Force | Out-Null
          Copy-Item Bin/PacePilot.exe dist/package/PacePilot.exe
          Copy-Item Setup-PacePilot.bat dist/package/Setup-PacePilot.bat
          Copy-Item README_FA.md dist/package/README_FA.md
          Copy-Item README_EN.md dist/package/README_EN.md
          Compress-Archive -Path dist/package/* -DestinationPath dist/PacePilot-Windows-x64.zip -Force
          if (-not (Test-Path dist/PacePilot-Windows-x64.zip)) { throw 'ZIP packaging failed' }
      - name: Publish ready-to-use Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PacePilot-Windows-x64-ZIP
          path: dist/PacePilot-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90
